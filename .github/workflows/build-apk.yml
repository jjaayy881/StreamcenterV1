name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Damit der Workflow ein Release erstellen/hochladen darf (Standard-GITHUB_TOKEN
# hat sonst nur Lese-Rechte auf den Repo-Inhalt).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Fortlaufende Versionsnummer statt "latest" ueberschreiben zu muessen -
      # Build-Nummer des Workflow-Laufs reicht hier voellig aus.
      - name: Set release tag
        id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Landet jetzt im "Releases"-Tab statt im "Actions"-Tab als Artifact -
      # zaehlt NICHT gegen das Actions-Artifact-Speicherlimit.
      - name: Publish APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "StreamCenterTV Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
