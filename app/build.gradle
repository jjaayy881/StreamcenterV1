plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.streamcenter.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.streamcenter.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Chaquopy braucht mind. eine ABI; arm64-v8a deckt Fire TV Cube & moderne Handys ab
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            // WICHTIG: tgcrypto wird bewusst NICHT installiert - es ist eine C-Erweiterung
            // ohne verlaessliches Android/Chaquopy-Wheel. Pyrogram faellt automatisch auf
            // die reine Python-Implementierung (pyaes) zurueck, wenn tgcrypto fehlt.
            pip {
                install "pyrogram==2.0.106"
                install "TgCrypto==1.2.5"
                install "aiohttp"
                install "certifi"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // LibVLC - volle Codec-Unterstuetzung (MP2/AC-3 etc.), MediaListPlayer fuer Zapping
    implementation 'org.videolan.android:libvlc-all:3.6.0'

    // Fuer Filmposter (Stalker-VOD/Serien, Mediathek) - laedt/cached poster_url-Bilder
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
